name: Release Workflow
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
  release:
    types:
      - published

jobs:
  # On a release PR (branch vX.Y.Z into main), check that the version
  # files agree with the branch name and build the package for inspection
  # (as the "dist" artifact on the workflow run).
  check:
    name: check release PR
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'v')
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Release preflight checks against the branch name
        run: .github/scripts/release_preflight.sh "$GITHUB_HEAD_REF"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Build package
        run: |
          pip install --upgrade pip
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist

  # On merge of a release PR to main, create a draft GitHub release.
  prep:
    name: draft release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'v')
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version=$(cat version.txt | xargs)
          title="pywatershed $version"

          # Check if this release already exists
          if gh release view "$version" &> /dev/null; then
            echo "Release $version already exists, skipping"
            exit 0
          fi

          gh release create "$version" \
            --target main \
            --title "$title" \
            --draft \
            --latest

  # On publish of the draft release, publish to pypi.
  publish:
    name: Publish package to pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
      pull-requests: write
      id-token: write # mandatory for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/pywatershed

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install build twine
          pip install .

      - name: Check package version matches the release tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          pkg_version=$(python -c "import pywatershed; print(pywatershed.__version__)")
          echo "release tag: $tag, package version: $pkg_version"
          if [ "$pkg_version" != "$tag" ]; then
            echo "Package version does not match the release tag. Did"
            echo "version files on main change after the release PR merged?"
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check --strict dist/*

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  # On publish of the draft release, attach the frozen (fully solved) conda
  # environment for each platform to the release. These record exactly the
  # dependency versions that worked at release time.
  freeze_envs:
    name: freeze conda env ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Dependencies via Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          log-level: debug
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Export frozen environment
        run: |
          micromamba env export --name pws > "environment_frozen_${{ runner.os }}.yml"
          cat "environment_frozen_${{ runner.os }}.yml"

      - name: Upload frozen environment to the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "environment_frozen_${{ runner.os }}.yml" --clobber
