name: CI example notebooks

on:
  push:
    branches:
      - "*"
      - "!v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    branches:
      - "*"
      - "!v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  test:
    name: ${{ matrix.os}} py${{ matrix.python-version }}

    runs-on: ${{ matrix.os }}

    env:
      # Force UTF-8 encoding on Windows to avoid cp1252 encoding issues
      PYTHONUTF8: ${{ matrix.os == 'windows-latest' && '1' || '' }}

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.13"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup gfortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 11

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment_w_jupyter.yml
          cache-environment: true
          cache-downloads: true
          create-args: >-
            python=${{matrix.python-version}}

      # - name: Checkout MODFLOW 6
      #   uses: actions/checkout@v6
      #   with:
      #     repository: MODFLOW-USGS/modflow6
      #     ref: develop
      #     path: modflow6

      # - name: Update flopy MODFLOW 6 classes
      #   working-directory: modflow6/autotest
      #   run: |
      #     # requires flopy[codegen] install option
      #     python -m flopy.mf6.utils.generate_classes

      # - name: Install mf6 nightly build binaries
      #   uses: modflowpy/install-modflow-action@v1
      #   with:
      #     repo: modflow6-nightly-build

      - name: Install error reporter
        run: |
          pip install pytest-github-actions-annotate-failures

      - name: Install dependencies and this package (test non-editable on windows)
        run: |
          ${{ matrix.os == 'windows-latest' && 'pip install .' || 'pip install -e .' }}

      - name: Version info
        run: |
          pip -V
          pip list

      - name: Import pywatershed
        run: |
          python -c "import pywatershed"

      - name: Get GIS files for tests
        run: |
          python pywatershed/utils/gis_files.py

      - name: Get additional domain files for notebooks
        run: |
          python pywatershed/utils/addtl_domain_files.py

      - name: Run tests
        working-directory: autotest_exs
        run: |
          pytest -s -vv  --durations=0
