        working-directory: test_data
        run: |
          find ucb_2yr/output -name '*.nc' | sort -n

      - name: ucb_2yr_nhm_transp_frost - list netcdf input files
        working-directory: test_data
        run: |
          find ucb_2yr/output_transp_frost -name '*.nc' | sort -n

      - name: ucb_2yr_nhm - pywatershed tests
        working-directory: autotest
        run: pytest
          -vv
          -rs
          -n=auto
          -m "not domainless"
          --domain=ucb_2yr
          --control_pattern=nhm.control
          --durations=0
          --cov=pywatershed
