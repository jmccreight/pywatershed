name: CI
on:
  push:
    branches:
      - "*"
      - "!v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    branches:
      - "*"
      - "!v[0-9]+.[0-9]+.[0-9]+*"

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false

jobs:
  pws_install:
    name: standard installation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip and install build and twine
        run: |
          python -m pip install --upgrade pip
          pip install wheel build twine importlib_metadata setuptools numpy

      - name: Standard installation
        run: |
          pip --verbose install .

      - name: Print pws version
        run: |
          python -c "import pywatershed; print(pywatershed.__version__)"

      - name: Build pywatershed, check dist outputs
        run: |
          python -m build
          twine check --strict dist/*

  pws_editable_install:
    name: editable installation
    runs-on: macos-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip and install build and twine
        run: |
          python -m pip install --upgrade pip
          pip install wheel build twine importlib_metadata setuptools numpy

      - name: Editable installation
        run: |
          pip --verbose install -e .

      - name: Print pws version
        run: |
          python -c "import pywatershed; print(pywatershed.__version__)"

      - name: Build pywatershed, check dist outputs
        run: |
          python -m build
          twine check --strict dist/*

  pyws_lint:
    name: linting
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install wheel
          pip install .
          pip install ".[lint]"

      - name: Version info
        run: |
          pip -V
          pip list

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

  test:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Set environment variables
        run: |
          echo "PYTHON_VERSION=${{ matrix.python-version }}" >> $GITHUB_ENV
          echo "PYWS_FORTRAN=false" >> $GITHUB_ENV
          cat .mf6_ci_ref_remote  >> $GITHUB_ENV

      - name: Enforce MF6 ref and remote merge to main
        if: github.base_ref == 'main'
        run: |
          echo Merge commit: GITHUB_BASE_REF = $GITHUB_BASE_REF
          req_ref=develop  # if not develop, submit an issue
          echo $MF6_REF
          if [[ "$MF6_REF" != "$req_ref" ]]; then exit 1; fi
          req_remote=MODFLOW-USGS/modflow6
          echo $MF6_REMOTE
          if [[ "$MF6_REMOTE" != "$req_remote" ]]; then echo "bad mf6 remote in .mf6_ci_ref_remote"; exit 1; fi

      - name: Setup gfortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 11

      - name: Link gfortran dylibs on Mac
        if: runner.os == 'macOS'
        run: .github/scripts/symlink_gfortran_mac.sh

      - name: Install Dependencies via Micromamba
        uses: mamba-org/setup-micromamba@v1.9.0
        with:
          micromamba-version: "1.5.10-0"
          log-level: debug
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          create-args: >-
            python=${{matrix.python-version}}

      - name: Checkout MODFLOW 6
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MF6_REMOTE }}
          ref: ${{ env.MF6_REF }}
          path: modflow6

      - name: Update flopy MODFLOW 6 classes
        working-directory: modflow6/autotest
        run: |
          # requires flopy[codgen] install option
          python -m flopy.mf6.utils.generate_classes

      - name: Install mf6 nightly build binaries
        uses: modflowpy/install-modflow-action@v1
        with:
          repo: modflow6-nightly-build

      - name: Install pywatershed
        run: |
          pip install .

      - name: Version info
        run: |
          pip -V
          pip list

      - name: Get GIS files for tests
        run: |
          python pywatershed/utils/gis_files.py

      - name: Get additional domain files for tests
        run: |
          python pywatershed/utils/addtl_domain_files.py
          if [ $? -ne 0 ]; then
            echo "Failed to download additional domain files"
            exit 1
          fi
          echo ""
          echo "Checking where additional domains were downloaded:"
          python -c "
          import pywatershed as pws
          pkg_root = pws.constants.__pywatershed_root__
          addtl_dir = pkg_root / 'data' / 'pywatershed_addtl_domains'
          print(f'Package root: {pkg_root}')
          print(f'Additional domains dir: {addtl_dir}')
          print(f'Additional domains exists: {addtl_dir.exists()}')
          if addtl_dir.exists():
              import os
              print(f'Contents: {os.listdir(addtl_dir)}')
          "

      - name: Create symlink to fgr_ag_2yr domain
        run: |
          echo "Current directory: $(pwd)"
          echo ""
          python -c "
          import os
          import sys
          import platform
          import shutil
          # Remove current directory from sys.path to avoid importing local source
          # We want the installed package in site-packages, not repo source
          if '' in sys.path:
              sys.path.remove('')
          if '.' in sys.path:
              sys.path.remove('.')
          cwd = os.getcwd()
          if cwd in sys.path:
              sys.path.remove(cwd)
          # Now import pywatershed from site-packages
          import pywatershed as pws
          # Find pywatershed package location using __file__
          pkg_dir = os.path.dirname(pws.__file__)
          src = os.path.join(pkg_dir, 'data', 'pywatershed_addtl_domains', 'fgr_ag_2yr')
          dst = 'test_data/fgr_ag_2yr'
          print(f'Platform: {platform.system()}')
          print(f'Package directory: {pkg_dir}')
          print(f'Source path: {src}')
          print(f'Source exists: {os.path.exists(src)}')
          print(f'Destination path: {dst}')
          print(f'Destination absolute: {os.path.abspath(dst)}')
          if not os.path.exists(src):
              print(f'ERROR: Source path does not exist!')
              print(f'Checking pywatershed/data:')
              data_dir = os.path.join(pkg_dir, 'data')
              if os.path.exists(data_dir):
                  print(f'Contents: {os.listdir(data_dir)}')
              sys.exit(1)
          if os.path.exists(dst):
              print(f'Removing existing destination')
              if os.path.islink(dst) or os.path.isfile(dst):
                  os.unlink(dst)
              else:
                  shutil.rmtree(dst)
          # On Windows, copy instead of symlink (symlinks require special privileges)
          if platform.system() == 'Windows':
              print(f'Copying directory (Windows)')
              shutil.copytree(src, dst)
          else:
              print(f'Creating symlink (Unix)')
              os.symlink(src, dst, target_is_directory=True)
          print(f'Link/copy created successfully')
          print(f'Destination exists (after): {os.path.exists(dst)}')
          "

      - name: domainless - run tests not requiring domain data
        working-directory: autotest
        run: pytest
          -m domainless
          -n=auto
          -vv
          --durations=0
          --cov=pywatershed
          --cov-report=xml
          --junitxml=pytest_domainless.xml

      # Temporarily disabled for fgr_ag_2yr debugging
      - name: sagehen_5yr_no_cascades - generate and manage test data domain, run PRMS and convert csv output to NetCDF
        working-directory: autotest
        run: |
          python generate_test_data.py \
            --domain=sagehen_5yr \
            --control_pattern=sagehen_no_cascades.control \
            --remove_prms_csvs --remove_prms_output_dirs

      - name: sagehen_5yr_no_cascades - list netcdf input files
        working-directory: test_data
        run: |
          find sagehen_5yr/output_no_cascades -name '*.nc' | sort -n

      - name: sagehen_5yr_no_cascades - pywatershed tests
        working-directory: autotest
        run: pytest
          -vv
          -rs
          -n=auto
          -m "not domainless"
          --domain=sagehen_5yr
          --control_pattern=sagehen_no_cascades.control
          --durations=0
          --cov=pywatershed
          --cov-report=xml
          --junitxml=pytest_sagehen_5yr_no_cascades.xml
          --ignore=test_cbh_to_netcdf.py
          --ignore=test_control_read.py
          --ignore=test_domain_subset.py
          --ignore=test_mmr_to_mf6_dfw.py
          --ignore=test_model.py
          --ignore=test_netcdf_subset.py
          --ignore=test_nhm_restart.py
          --ignore=test_obsin_flow_node.py
          --ignore=test_output.py
          --ignore=test_pass_through_flow_graph.py
          --ignore=test_prms_atmosphere_transp_frost.py
          --ignore=test_prms_channel.py
          --ignore=test_prms_channel_flow_graph.py
          --ignore=test_prms_et.py
          --ignore=test_prms_et_can_runoff.py
          --ignore=test_prms_et_canopy.py
          --ignore=test_prms_hydraulic_geometry.py
          --ignore=test_prms_runoff.py
          --ignore=test_prms_runoff_ag.py
          --ignore=test_prms_runoff_ag_restart.py
          --ignore=test_prms_runoff_soilzone_ag.py
          --ignore=test_prms_soilzone_ag.py
          --ignore=test_prms_soilzone_ag_restart.py
          --ignore=test_prms_stream_temp.py
          --ignore=test_source_sink_flow_node.py
          --ignore=test_starfit_flow_graph.py

      - name: hru_1 all configs - generate and manage test data, run PRMS and convert csv output to NetCDF
        working-directory: autotest
        run: |
          python generate_test_data.py \
            -n=auto --domain=hru_1 \
            --remove_prms_csvs --remove_prms_output_dirs \
            --control_pattern=nhm.control \
            --control_pattern=frost.control

      - name: hru_1_nhm - list netcdf input files
        working-directory: test_data
        run: |
          find hru_1/output -name '*.nc' | sort -n

      - name: hru_1_nhm_transp_frost - list netcdf input files
        working-directory: test_data
        run: |
          find hru_1/output_transp_frost -name '*.nc' | sort -n

      - name: hru_1_nhm - pywatershed tests
        working-directory: autotest
        run: pytest
          -vv
          -rs
          -n=auto
          -m "not domainless"
          --domain=hru_1
          --control_pattern=nhm.control
          --durations=0
          --cov=pywatershed
          --cov-report=xml
          --junitxml=pytest_hru_1_nhm.xml
          --ignore=test_domain_subset.py
          --ignore=test_mmr_to_mf6_dfw.py
          --ignore=test_obsin_flow_node.py
          --ignore=test_output.py
          --ignore=test_pass_through_flow_graph.py
          --ignore=test_prms_atmosphere_transp_frost.py
          --ignore=test_prms_channel_flow_graph.py
          --ignore=test_prms_hydraulic_geometry.py
          --ignore=test_prms_runoff_ag.py
          --ignore=test_prms_runoff_ag_restart.py
          --ignore=test_prms_runoff_soilzone_ag.py
          --ignore=test_prms_soilzone_ag.py
          --ignore=test_prms_soilzone_ag_restart.py
          --ignore=test_prms_stream_temp.py
          --ignore=test_source_sink_flow_node.py
          --ignore=test_starfit_flow_graph.py

      - name: hru_1_nhm_transp_frost - pywatershed tests
        working-directory: autotest
        run: pytest
          -vv
          -rs
          -n=auto
          -m "not domainless"
          --domain=hru_1
          --control_pattern=transp_frost.control
          --durations=0
          --cov=pywatershed
          --cov-report=xml
          --junitxml=pytest_hru_1_transp_frost.xml
          test_prms_atmosphere_transp_frost.py

      - name: drb_2yr all domains - generate and manage test data
        working-directory: autotest
        run: |
          python generate_test_data.py \
            -n=auto --domain=drb_2yr \
            --remove_prms_csvs --remove_prms_output_dirs

      - name: drb_2yr all domains - list netcdf input files
        working-directory: test_data
        run: |
          find drb_2yr/output*/ -name '*.nc' | sort -n

      - name: drb_2yr_nhm - pywatershed tests
        working-directory: autotest
        run: pytest
          -vv
          -rs
          -n=auto
          -m "not domainless"
          --domain=drb_2yr
          --control_pattern=nhm.control
          --durations=0
