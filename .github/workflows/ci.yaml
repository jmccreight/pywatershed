      - name: fgr_ag_2yr all configs - generate and manage test data
        working-directory: autotest
        run: |
          python generate_test_data.py \
            -n=auto \
            --domain=fgr_ag_2yr \
            --remove_prms_csvs \
            --remove_prms_output_dirs \
